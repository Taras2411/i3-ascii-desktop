name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk i3-wm
      - name: Install Python dependencies
        run: python -m pip install -r share/center-desktop/requirements.lock
      - name: Behavior and source checks
        run: python scripts/check.py
      - name: Validate example i3 configuration
        run: i3 -C -c config/i3.conf
